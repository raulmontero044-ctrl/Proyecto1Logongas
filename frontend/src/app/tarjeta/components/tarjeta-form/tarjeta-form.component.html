<form [formGroup]="formulario" (ngSubmit)="enviar()" novalidate>
  <div class="mb-3">
    <label for="nombrePropietario" class="form-label">Nombre del propietario</label>
    <input
      id="nombrePropietario"
      type="text"
      class="form-control"
      [class.is-invalid]="nombrePropietario.invalid && nombrePropietario.touched"
      formControlName="nombrePropietario"
    />
    @if (nombrePropietario.invalid && nombrePropietario.touched) {
      <div class="invalid-feedback">El nombre del propietario es obligatorio.</div>
    }
  </div>

  <div class="mb-3">
    <label for="tipo" class="form-label">Tipo de tarjeta</label>
    <select id="tipo" class="form-select" formControlName="tipo">
      <option [ngValue]="null">Sin tipo</option>
      @for (tipo of tipos; track tipo.id) {
        <option [ngValue]="tipo.nombre">{{ tipo.nombre }}</option>
      }
    </select>
  </div>

  <div class="d-flex gap-2">
    <button type="submit" class="btn btn-primary" [disabled]="enviando">
      Crear tarjeta
    </button>
    <button type="button" class="btn btn-outline-secondary" (click)="cancelar.emit()">
      Cancelar
    </button>
  </div>
</form>

@if (cargando) {
  <div class="alert alert-info mt-3" data-testid="cargando" role="status">
    Cargando tarjeta…
  </div>
}

@if (errorMensaje) {
  <div class="alert alert-danger mt-3" data-testid="error-consulta" role="alert">
    <strong>{{ errorCodigo }}</strong>
    <span>{{ errorMensaje }}</span>
  </div>
}

@if (tarjeta) {
  <article class="mt-3" data-testid="detalle">
    <p data-testid="propietario">
      Propietario: <span>{{ tarjeta.nombrePropietario }}</span>
    </p>
    <p data-testid="tipo">
      Tipo: <span class="text-uppercase fw-bold">{{ tipoVisible }}</span>
    </p>
  </article>
}
